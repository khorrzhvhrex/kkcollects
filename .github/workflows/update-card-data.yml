name: Update local card data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out KKM repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch current TCGdex source database
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex-cards

      - name: Build compact local card database
        run: |
          node tools/update_local_data.mjs --source /tmp/tcgdex-cards

      - name: Commit refreshed local data
        run: |
          if git diff --quiet -- data; then
            echo "No local card-data changes found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git commit -m "Update local Pokémon card data"
          git push
